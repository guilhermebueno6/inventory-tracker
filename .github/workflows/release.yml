name: release

on:
  push:
    tags: ["v*"]
  # Para quando o Release já existe mas ficou sem os executáveis (build que
  # falhou, ou Release criado à mão pela interface do GitHub). Rode este
  # workflow a partir da main informando a tag: ele compila o código DA TAG e
  # anexa os arquivos ao Release que já está lá, sem apagar nem remarcar nada.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag já publicada (ex.: v0.3)"
        required: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            alvo: windows
          - os: macos-latest
            alvo: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -e ".[dev]"

      - name: Versão da tag
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: echo "APP_VERSION=${TAG#v}" >> $GITHUB_ENV

      # Se a tag e o version.py divergirem, o app instalado compara a versão
      # dele com a do release, nunca fica igual, e passa a oferecer atualização
      # para sempre. Melhor falhar aqui do que descobrir na máquina dela.
      - name: A tag precisa bater com o version.py
        shell: bash
        run: |
          # Comparação por número, não por texto: a tag v0.3 e o version.py
          # 0.3.0 são a MESMA versão, e é assim que o updater as compara
          # (services/updater._versao_tupla). Comparar o texto cru derrubou o
          # build da v0.3 e o Release saiu sem nenhum executável.
          python - <<'PY'
          import os, re, sys
          from estoque_facil.version import __version__

          def normalizar(texto):
              numeros = re.findall(r"\d+", texto or "")
              return tuple(int(n) for n in (numeros + ["0", "0", "0"])[:3])

          tag = os.environ["APP_VERSION"]
          if normalizar(tag) != normalizar(__version__):
              print(f"A tag diz v{tag}, mas version.py diz {__version__}.")
              print("Ajuste src/estoque_facil/version.py e marque a tag de novo.")
              sys.exit(1)
          print(f"versão conferida: tag v{tag} == version.py {__version__}")
          PY

      - name: Build
        run: pyinstaller packaging/estoque_facil.spec --noconfirm

      # Sem isto, um erro de empacotamento só apareceria na máquina dela.
      # Foi assim que passou despercebido que o app nem abria.
      - name: Teste de fumaça do executável (Windows)
        if: matrix.alvo == 'windows'
        run: .\dist\EstoqueFacil\EstoqueFacil.exe --verificar

      - name: Teste de fumaça do executável (macOS)
        if: matrix.alvo == 'macos'
        run: ./dist/EstoqueFacil/EstoqueFacil --verificar

      - name: Instalador do Windows
        if: matrix.alvo == 'windows'
        shell: pwsh
        run: |
          # O runner do windows-latest já traz o Inno Setup no PATH (confirmado
          # no build v0.1.1). O caminho fixo e o choco ficam só como reserva,
          # para o dia em que a imagem do runner mudar.
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) {
            Write-Host "Inno Setup ausente — instalando"
            choco install innosetup -y --no-progress
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe não encontrado" }

          # NÃO criar a pasta artefatos aqui: quem a cria é o OutputDir do
          # installer.iss. Um `mkdir artefatos` depois disso falha porque ela
          # já existe — foi o que derrubou o build da v0.1.1.
          & $iscc packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC falhou" }
          Get-ChildItem artefatos

      - name: DMG do macOS
        if: matrix.alvo == 'macos'
        run: |
          bash packaging/macos/build_dmg.sh
          mkdir -p artefatos
          cp dist/*.dmg artefatos/

      # shasum não é confiável entre Windows e macOS; python está garantido aqui
      - name: SHA256 (o updater confere isto — §10.1)
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, pathlib
          pasta = pathlib.Path("artefatos")
          linhas = [
              f"{hashlib.sha256(a.read_bytes()).hexdigest()}  {a.name}"
              for a in sorted(pasta.iterdir())
              if a.is_file() and a.name != "SHA256SUMS"
          ]
          (pasta / "SHA256SUMS").write_text("\n".join(linhas) + "\n")
          print("\n".join(linhas))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.alvo }}
          path: artefatos/*

  publicar:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: tudo
      - name: Juntar os artefatos das duas plataformas
        run: |
          mkdir -p release
          find tudo -type f ! -name SHA256SUMS -exec cp {} release/ \;
          cat tudo/*/SHA256SUMS > release/SHA256SUMS
          ls -la release
          test -s release/SHA256SUMS || { echo "SHA256SUMS vazio"; exit 1; }

          # Um Release sem instalador não serve para ninguém: nem para baixar à
          # mão, nem para o updater (services/updater procura .exe e .dmg).
          # Melhor falhar aqui do que publicar um Release vazio como o da v0.3.
          ls release/*.exe >/dev/null 2>&1 || { echo "faltou o instalador do Windows"; exit 1; }
          ls release/*.dmg >/dev/null 2>&1 || { echo "faltou o DMG do macOS"; exit 1; }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: release/*
          # No gatilho manual o Release já existe e já tem texto: só anexamos os
          # arquivos, sem reescrever as notas que estão publicadas.
          generate_release_notes: ${{ github.event_name == 'push' }}
