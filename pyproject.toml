[project]
name = "estoque-facil"
version = "0.1.0"
description = "Controle de estoque para loja do Mercado Livre"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "openpyxl>=3.1",
    "platformdirs>=4.0",
    "httpx>=0.27",
    "keyring>=25.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "pyinstaller>=6.0"]

[project.scripts]
estoque-facil = "estoque_facil.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# A folha de estilo e a pasta da marca (fonte Archivo, símbolo, ícones e as
# setas do QSS) não são .py, então não entram no wheel sozinhas — sem isto o
# app instalado abre com a fonte do sistema e sem ícone.
[tool.setuptools.package-data]
estoque_facil = [
    "ui/*.qss",
    "resources/*.ico",
    "resources/*.icns",
    "resources/fontes/*",
    "resources/marca/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore:Workbook contains no default style:UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# migrações são geradas pelo Alembic; não reformatar à mão
"src/estoque_facil/migracoes/versions/*" = ["E501"]
